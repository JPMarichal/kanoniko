[project]
name = "alejandria"
version = "0.1.0"
description = "Bilingual text library with textual, semantic, and knowledge graph search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "aiofiles>=23.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]
semantic = [
    "sentence-transformers>=3.0",
]
graph = [
    "spacy>=3.7",
]
mcp = [
    "mcp>=1.0",
]
chat = [
    "anthropic>=0.40",
    "openai>=1.50",
]
postgres = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[project.scripts]
alejandria = "alejandria.cli:main"
alejandria-api = "alejandria.main:start"
alejandria-mcp = "alejandria.mcp_server:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

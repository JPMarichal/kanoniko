# GPU override — use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Requires: Docker Engine with NVIDIA Container Toolkit (Ubuntu-20.04 WSL)
# NOT compatible with Rancher Desktop — use native Docker in Ubuntu WSL
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    volumes:
      # Override corpus mount: use git clone on Linux FS for fast I/O
      # Sync with: cd /home/jpmarichal/alejandria-repo && git pull
      - /home/jpmarichal/alejandria-repo/corpus:/app/corpus:ro
      - /home/jpmarichal/alejandria-data/sqlite:/app/data/sqlite
      - /home/jpmarichal/alejandria-data/models:/root/.cache
    environment:
      - ALEJANDRIA_EMBEDDING_DEVICE=cuda
    mem_limit: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  neo4j:
    environment:
      # APOC plugin for graph utilities (not needed for backup — backup uses Cypher streaming)
      - NEO4J_PLUGINS=["apoc"]

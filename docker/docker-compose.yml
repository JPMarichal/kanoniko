services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alejandria-api
    ports:
      - "4300:4300"
    volumes:
      # Corpus: bind mount from host, read-only — NOT containerized
      - ${ALEJANDRIA_CORPUS_PATH:-../corpus}:/app/corpus:ro
      # Scripture structure data (cross-references, etc.)
      - ../data/scripture_structure:/app/data/scripture_structure:ro
      # SQLite data: bind mount (shared with host/WSL for GPU reindex)
      - ../data/sqlite:/app/data/sqlite
      # Model cache: so embedding model is downloaded once
      - alejandria-models:/root/.cache
    env_file:
      - .env
    environment:
      - ALEJANDRIA_HOST=0.0.0.0
      - ALEJANDRIA_PORT=4300
      - ALEJANDRIA_CORPUS_PATH=/app/corpus
      - ALEJANDRIA_SQLITE_DB_PATH=/app/data/sqlite/alejandria.db
      - ALEJANDRIA_EMBEDDING_DEVICE=cpu
      - ALEJANDRIA_NEO4J_URI=bolt://neo4j:7687
      - ALEJANDRIA_NEO4J_USER=neo4j
      - ALEJANDRIA_NEO4J_PASSWORD=${NEO4J_PASSWORD:-alejandria}
    depends_on:
      neo4j:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4300/health')"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  neo4j:
    image: neo4j:5-community
    container_name: alejandria-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - alejandria-neo4j:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-alejandria}
      # Limit JVM heap — default is too aggressive for our graph size
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-alejandria} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  alejandria-models:
  alejandria-neo4j:

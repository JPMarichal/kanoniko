services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alejandria-api
    ports:
      - "4300:4300"
    volumes:
      # Corpus: bind mount from host, read-only — NOT containerized
      - ${ALEJANDRIA_CORPUS_PATH:-../corpus}:/app/corpus:ro
      # Scripture structure data (cross-references, etc.)
      - ../data/scripture_structure:/app/data/scripture_structure:ro
      # SQLite data: bind mount (shared with host/WSL for GPU reindex).
      # Transitional — retired together with SQLite in §3.4.
      - ../data/sqlite:/app/data/sqlite
      # Model cache: so embedding model is downloaded once
      - alejandria-models:/root/.cache
    env_file:
      - .env
    environment:
      - ALEJANDRIA_HOST=0.0.0.0
      - ALEJANDRIA_PORT=4300
      - ALEJANDRIA_CORPUS_PATH=/app/corpus
      - ALEJANDRIA_SQLITE_DB_PATH=/app/data/sqlite/alejandria.db
      - ALEJANDRIA_EMBEDDING_DEVICE=cpu
      # Postgres connection (ALEJANDRIA_POSTGRES_*) is loaded from .env.
      # No container service — the authoritative KG lives in Postgres
      # IONOS, reached via SSH tunnel on the host (localhost:15432).
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4300/health')"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  alejandria-models:

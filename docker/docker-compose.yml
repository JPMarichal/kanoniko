services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: alejandria-api
    ports:
      - "4300:4300"
    volumes:
      # Corpus: bind mount from host, read-only — NOT containerized
      - ${ALEJANDRIA_CORPUS_PATH:-../corpus}:/app/corpus:ro
      # Scripture structure data (cross-references, etc.)
      - ../data/scripture_structure:/app/data/scripture_structure:ro
      # Model cache: so embedding model is downloaded once
      - alejandria-models:/root/.cache
    env_file:
      # Load credentials (ALEJANDRIA_POSTGRES_*, ALEJANDRIA_LLM_*, …) from
      # the repo-root .env rather than docker/.env so the same file the
      # host shell sources (scripts, tunnel setup) is the single source
      # of truth. The docker/.env.example template points at the same path.
      - ../.env
    extra_hosts:
      # Containers on the default bridge network can reach the SSH tunnel
      # bound on the host at localhost:15432 via host.docker.internal.
      - "host.docker.internal:host-gateway"
    environment:
      - ALEJANDRIA_HOST=0.0.0.0
      - ALEJANDRIA_PORT=4300
      - ALEJANDRIA_CORPUS_PATH=/app/corpus
      - ALEJANDRIA_EMBEDDING_DEVICE=cpu
      # Redirect POSTGRES_HOST to the Docker host gateway: the SSH tunnel
      # to IONOS binds on the WSL host's localhost:15432, which containers
      # on the default bridge reach via host.docker.internal. This
      # override wins over the env_file's "localhost" (valid only on the
      # host shell). Other ALEJANDRIA_POSTGRES_* come from ../.env.
      - ALEJANDRIA_POSTGRES_HOST=host.docker.internal
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4300/health')"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  alejandria-models:
